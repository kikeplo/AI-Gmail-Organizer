name: Build Windows application

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install 'pyinstaller>=6,<7'

      - name: Prepare Playwright Chromium
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "$env:GITHUB_WORKSPACE\.playwright"
          if (Test-Path $env:PLAYWRIGHT_BROWSERS_PATH) {
            Remove-Item $env:PLAYWRIGHT_BROWSERS_PATH -Recurse -Force
          }
          New-Item -ItemType Directory -Path $env:PLAYWRIGHT_BROWSERS_PATH | Out-Null
          python -m playwright install chromium

      - name: Build portable application folder
        shell: pwsh
        run: |
          $env:GITHUB_ACTIONS = 'true'
          powershell -ExecutionPolicy Bypass -File packaging\build_portable_windows.ps1

      - name: Verify packaged runtime
        shell: pwsh
        run: |
          $appDir = Join-Path $env:GITHUB_WORKSPACE 'dist\AI-Gmail-Organizer'
          $exe = Join-Path $appDir 'AI-Gmail-Organizer.exe'
          if (-not (Test-Path $appDir)) { throw "Missing application folder: $appDir" }
          if (-not (Test-Path $exe)) { throw "Missing EXE: $exe" }
          $chrome = Get-ChildItem -Path $appDir -Recurse -Filter 'chrome.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $chrome) { throw 'Bundled Chromium was not found.' }
          Write-Host "Verified portable app folder: $appDir"
          Write-Host "Verified launcher: $exe"
          Write-Host "Verified Chromium: $($chrome.FullName)"
          Write-Host 'Python automation dependencies are bundled inside the PyInstaller application archive; they are not expected as loose files.'

      - name: Run packaged smoke test
        shell: pwsh
        run: |
          python packaging\smoke_test_windows.py

      - name: Create ZIP
        shell: pwsh
        run: |
          $appDir = Join-Path $env:GITHUB_WORKSPACE 'dist\AI-Gmail-Organizer'
          $zip = Join-Path $env:GITHUB_WORKSPACE 'dist\AI-Gmail-Organizer-Windows.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$appDir\*" -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw 'ZIP was not created.' }

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: AI-Gmail-Organizer-Windows
          path: |
            dist/AI-Gmail-Organizer/**
            dist/AI-Gmail-Organizer-Windows.zip
          if-no-files-found: error
          retention-days: 30
