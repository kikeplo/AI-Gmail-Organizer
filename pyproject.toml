[project]
name = "ai-gmail-organizer"
version = "3.7.0"
description = "Hybrid Windows desktop assistant for Gmail organization, local AI, desktop automation, browser automation, vision, reusable skills, learned procedures, autonomous task planning, robust Windows app control, guided dependency setup, portable deployment, and smart AI provider failover."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "python-dotenv>=1.0,<2",
    "openai>=1.100,<2",
    "google-api-python-client>=2.180,<3",
    "google-auth-httplib2>=0.2,<1",
    "google-auth-oauthlib>=1.2,<2",
    "pywin32>=311; sys_platform == 'win32'",
    "PyAutoGUI>=0.9.54; sys_platform == 'win32'",
    "pywinauto>=0.6.8,<1; sys_platform == 'win32'",
    "playwright>=1.50,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pyinstaller>=6,<7",
]

[project.scripts]
ai-gmail-organizer = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
